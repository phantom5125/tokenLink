name: Bug report
description: Report a reproducible problem in TokenLink
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Remove secrets and
        personal identifiers before attaching logs, screenshots, or diagnostics.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched open and closed issues for the same problem.
          required: true
        - label: I can reproduce this on an unmodified TokenLink build or current main.
          required: true
        - label: I removed API keys, tokens, account data, personal paths, and device UUIDs.
          required: true
  - type: input
    id: version
    attributes:
      label: TokenLink version or commit
      description: Use a release version or full commit SHA.
      placeholder: v0.2.0 or 0123456789abcdef...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include macOS version, Mac architecture, and Swift/Xcode version when building from source.
      placeholder: macOS 15.6, Apple Silicon, Xcode 16.x
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Menu bar or overview
        - Codex provider
        - Claude provider
        - Kimi provider
        - MiniMax provider
        - GLM provider
        - StopWatch or Bluetooth
        - Settings, Keychain, or diagnostics
        - Build, packaging, or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe one problem and why it matters.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Add sanitized logs, screenshots, a minimal fixture, or a repository that reproduces the issue.
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Include frequency, regressions, workarounds, or a suspected cause if known.
