name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS app
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: bash scripts/test.sh
      - name: Lint
        run: |
          swift format lint --strict Package.swift
          swift format lint --recursive --strict Sources Tests
      - name: Privacy scan
        run: bash scripts/privacy_scan.sh
      - name: Validate Homebrew cask contract
        run: bash scripts/test_homebrew_cask.sh
      - name: Package with distribution notices
        run: |
          bash scripts/build_release_artifact.sh
          cmp LICENSE .build/artifacts/TokenLink.app/Contents/Resources/LICENSE
          cmp NOTICE .build/artifacts/TokenLink.app/Contents/Resources/NOTICE
      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenLink-macos-universal
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  firmware:
    name: C152 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Test release packager
        run: python scripts/test_package_firmware_release.py
      - name: Check Mac/firmware protocol contract
        run: python scripts/check_firmware_contract.py
      - name: Build and test C152 firmware
        run: TOKENLINK_PIO="$(command -v pio)" bash scripts/test_firmware.sh
      - name: Package C152 artifacts
        run: TOKENLINK_PIO="$(command -v pio)" bash scripts/build_firmware_artifact.sh
      - name: Verify release checksums
        run: cd dist/firmware && sha256sum -c SHA256SUMS
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenLink-StopWatch-C152
          path: dist/firmware/*
          if-no-files-found: error

  build-test:
    name: build-test
    if: ${{ always() }}
    needs: [macos, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Require Mac and firmware CI
        env:
          MACOS_RESULT: ${{ needs.macos.result }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
        run: |
          test "$MACOS_RESULT" = success
          test "$FIRMWARE_RESULT" = success

  resources:
    needs: build-test
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Enforce local-app resource budgets
        run: bash scripts/resource_check.sh
