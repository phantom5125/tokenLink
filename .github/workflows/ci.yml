name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Lint
        run: swift format lint --recursive --strict Sources Tests
      - name: Privacy scan
        run: bash scripts/privacy_scan.sh
      - name: Package with distribution notices
        run: |
          bash scripts/package_app.sh
          cmp LICENSE TokenLink.app/Contents/Resources/LICENSE
          cmp NOTICE TokenLink.app/Contents/Resources/NOTICE
