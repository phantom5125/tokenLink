name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  macos:
    name: macOS DMG
    runs-on: macos-15
    outputs:
      distribution: ${{ steps.signing.outputs.distribution }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Configure release signing
        id: signing
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.TOKENLINK_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.TOKENLINK_DEVELOPER_ID_P12_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.TOKENLINK_CODESIGN_IDENTITY }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.TOKENLINK_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.TOKENLINK_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.TOKENLINK_NOTARY_ISSUER_ID }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "distribution=development" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_secrets=(
            DEVELOPER_ID_P12_BASE64
            DEVELOPER_ID_P12_PASSWORD
            CODESIGN_IDENTITY
            NOTARY_KEY_P8_BASE64
            NOTARY_KEY_ID
            NOTARY_ISSUER_ID
          )
          configured_secrets=0
          for secret_name in "${release_secrets[@]}"; do
            if [[ -n "${!secret_name}" ]]; then
              configured_secrets=$((configured_secrets + 1))
            fi
          done

          if [[ "$configured_secrets" -eq 0 ]]; then
            echo "::warning::Publishing an explicitly labelled community build without Apple notarization."
            echo "distribution=community" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$configured_secrets" -ne "${#release_secrets[@]}" ]]; then
            echo "Developer ID/notarization secrets are only partially configured." >&2
            exit 1
          fi

          require_secret() {
            if [[ -z "${!1}" ]]; then
              echo "Missing required release secret: $1" >&2
              exit 1
            fi
          }

          require_secret DEVELOPER_ID_P12_BASE64
          require_secret DEVELOPER_ID_P12_PASSWORD
          require_secret CODESIGN_IDENTITY
          require_secret NOTARY_KEY_P8_BASE64
          require_secret NOTARY_KEY_ID
          require_secret NOTARY_ISSUER_ID

          signing_dir="$RUNNER_TEMP/tokenlink-signing"
          keychain_path="$signing_dir/tokenlink-signing.keychain-db"
          certificate_path="$signing_dir/developer-id.p12"
          notary_key_path="$signing_dir/AuthKey_$NOTARY_KEY_ID.p8"
          keychain_password="$(openssl rand -hex 32)"
          mkdir -p "$signing_dir"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$certificate_path"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 -D > "$notary_key_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | \
            grep -F "\"$CODESIGN_IDENTITY\""

          xcrun notarytool store-credentials tokenlink-ci-notary \
            --key "$notary_key_path" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$keychain_path"

          {
            echo "TOKENLINK_CODESIGN_IDENTITY=$CODESIGN_IDENTITY"
            echo "TOKENLINK_NOTARY_PROFILE=tokenlink-ci-notary"
            echo "TOKENLINK_NOTARY_KEYCHAIN=$keychain_path"
          } >> "$GITHUB_ENV"
          echo "distribution=notarized" >> "$GITHUB_OUTPUT"
      - name: Verify tag version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' packaging/Info.plist)"
          tag_version="${GITHUB_REF_NAME#v}"
          base_version="${tag_version%%-*}"
          test "$version" = "$base_version"
          if [[ "$tag_version" == *-* ]]; then
            [[ "$tag_version" =~ ^${version}-(alpha|beta|rc)\.[0-9]+$ ]]
          else
            test "$tag_version" = "$version"
          fi
      - name: Build and verify Mac archive
        run: bash scripts/build_release_artifact.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error

  firmware:
    name: C152 firmware artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PlatformIO
        run: python -m pip install platformio==6.1.19
      - name: Verify tag version
        run: |
          version="$(sed -n 's/.*kFirmwareVersion\[\] = "\([0-9][0-9.]*\)-tokenlink".*/\1/p' firmware/stopwatch-c152/include/CodexMicroBle.h)"
          tag_version="${GITHUB_REF_NAME#v}"
          base_version="${tag_version%%-*}"
          test "$version" = "$base_version"
          if [[ "$tag_version" == *-* ]]; then
            [[ "$tag_version" =~ ^${version}-(alpha|beta|rc)\.[0-9]+$ ]]
          else
            test "$tag_version" = "$version"
          fi
      - name: Build, test, and package C152 firmware
        run: |
          export TOKENLINK_PIO="$(command -v pio)"
          python scripts/test_package_firmware_release.py
          python scripts/check_firmware_contract.py
          bash scripts/test_firmware.sh
          bash scripts/build_firmware_artifact.sh
      - name: Verify release checksums
        run: cd dist/firmware && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-release
          path: dist/firmware/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [macos, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true
      - name: Verify stable Homebrew tap access
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "Missing required release secret: HOMEBREW_TAP_TOKEN" >&2
            exit 1
          fi
          gh api repos/phantom5125/homebrew-tap --jq '.default_branch' | grep -Fx main
      - name: Publish checksummed assets
        env:
          DISTRIBUTION: ${{ needs.macos.outputs.distribution }}
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease_options=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_options+=(--prerelease)
          fi

          notes_file="$RUNNER_TEMP/tokenlink-release-notes.md"
          cp "docs/releases/${GITHUB_REF_NAME#v}.md" "$notes_file"
          if [[ "$DISTRIBUTION" == "community" ]]; then
            printf '\n\n## macOS distribution identity\n\n' >> "$notes_file"
            printf '%s\n' \
              'This community-funded DMG is ad-hoc signed and is not Apple-notarized.' \
              'Review the published checksum and source before opening it. macOS may' \
              'require explicit approval in System Settings → Privacy & Security.' \
              >> "$notes_file"
          elif [[ "$DISTRIBUTION" == "notarized" ]]; then
            printf '\n\n## macOS distribution identity\n\n' >> "$notes_file"
            printf '%s\n' \
              'The DMG and contained app are Developer ID signed, Apple-notarized,' \
              'stapled, and Gatekeeper-verified by the release workflow.' \
              >> "$notes_file"
          fi

          gh release create "$GITHUB_REF_NAME" \
            release-assets/* \
            --verify-tag \
            "${prerelease_options[@]}" \
            --title "TokenLink ${GITHUB_REF_NAME#v}" \
            --notes-file "$notes_file"

  homebrew:
    name: Update Homebrew tap
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [macos, publish]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release-assets
      - uses: actions/checkout@v4
        with:
          repository: phantom5125/homebrew-tap
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Render stable cask
        env:
          DISTRIBUTION: ${{ needs.macos.outputs.distribution }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg="release-assets/TokenLink-$version.dmg"
          checksum="$dmg.sha256"
          test -f "$dmg"
          test -f "$checksum"
          (cd release-assets && shasum -a 256 -c "$(basename "$checksum")")
          sha256="$(awk 'NR == 1 { print $1 }' "$checksum")"
          bash source/scripts/render_homebrew_cask.sh \
            "$version" \
            "$sha256" \
            "$DISTRIBUTION" \
            tap/Casks/tokenlink.rb
      - name: Audit and install cask from a local tap
        run: |
          brew tap-new tokenlink-ci/tap --no-git
          ci_tap="$(brew --repository tokenlink-ci/tap)"
          mkdir -p "$ci_tap/Casks"
          cp tap/Casks/tokenlink.rb "$ci_tap/Casks/tokenlink.rb"
          brew audit --cask --strict tokenlink-ci/tap/tokenlink
          brew install --cask tokenlink-ci/tap/tokenlink
          installed_version="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            /Applications/TokenLink.app/Contents/Info.plist)"
          test "$installed_version" = "${GITHUB_REF_NAME#v}"
          codesign --verify --deep --strict /Applications/TokenLink.app
      - name: Publish cask update
        run: |
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Casks/tokenlink.rb
          if git -C tap diff --cached --quiet; then
            echo "Homebrew cask is already current."
            exit 0
          fi
          git -C tap commit -m "tokenlink ${GITHUB_REF_NAME#v}"
          git -C tap push origin HEAD:main
