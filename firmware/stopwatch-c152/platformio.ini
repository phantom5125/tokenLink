[platformio]
default_envs = m5stack-stopwatch

[env:m5stack-stopwatch]
platform = espressif32 @ 6.12.0
board = esp32s3box
framework = arduino
board_build.partitions = partitions/default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 1500000
extra_scripts =
  pre:scripts/patch_m5gfx_amoled_sleep.py
  post:scripts/export_release_files.py
lib_deps =
  M5Unified = https://github.com/m5stack/M5Unified.git#4fb444784c85791e0b0207701392b42be234b2e7
  M5GFX = https://github.com/m5stack/M5GFX.git#729297d6e3d657ddc1ec5189bac2f2ea68828085
  M5PM1 = https://github.com/m5stack/M5PM1.git#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
  M5IOE1 = https://github.com/m5stack/M5IOE1.git#846eec7d05e25c09013be2acdb8804487f48a62e
  bblanchon/ArduinoJson @ 6.21.6
build_flags =
  -DESP32S3
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
[env:native-preview]
platform = native
build_type = release
lib_extra_dirs = .pio/libdeps/m5stack-stopwatch
lib_ignore = M5Unified, M5PM1, M5IOE1
build_src_filter = -<*> +<../simulator/preview_main.cpp>
build_flags =
  -std=c++17
  -Iinclude
  -I"${sysenv.HOMEBREW_PREFIX}/include/SDL2"
  -L"${sysenv.HOMEBREW_PREFIX}/lib"
  -lSDL2
